name: Discover KTU timetable notices

on:
  push:
    branches: [main]
    paths:
      - "scripts/discover_ktu_timetables.py"
      - "scripts/extract_nov_2026_timetables.py"
      - "src/data/november-2026-timetables.json"
      - ".github/workflows/ktu-timetable-discovery.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 pypdf
      - name: Extract published S5 and S7 November 2026 PDFs
        run: |
          python -m pip install pypdf
          python scripts/extract_nov_2026_timetables.py
      - name: Discover KTU timetable notices from multiple sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/discover_ktu_timetables.py

      - name: Commit extracted timetable data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/november-2026-timetables.json
          if ! git diff --cached --quiet; then
            git commit -m "Update extracted November 2026 KTU timetable data"
            git pull --rebase origin main
            git push
          else
            echo "Timetable data is unchanged."
          fi
