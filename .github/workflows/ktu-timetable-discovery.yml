name: Build approved KTU timetable data

on:
  push:
    branches: [main]
    paths:
      - "scripts/extract_nov_2026_timetables.py"
      - "src/data/november-2026-timetables.json"
      - ".github/workflows/ktu-timetable-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-approved-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction dependency
        run: python -m pip install pypdf
      - name: Extract all user-approved November 2026 PDFs
        run: python scripts/extract_nov_2026_timetables.py
      - name: Publish extracted timetable data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/november-2026-timetables.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish extracted November 2026 KTU timetable data"
            git pull --rebase origin main
            git push
          else
            echo "Timetable data is unchanged."
          fi
